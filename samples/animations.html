<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeon — map animations</title>
<link rel="stylesheet" href="../css/pixelify.css">
<style>
  :root { --ink: #2a1a0e; --soft: #6b4a2a; --red: #8a3a22; --paper: #e9d6ad; }
  body { margin: 0; background: #2a1d12; color: var(--ink); font: 15px/1.4 "Pixelify Sans", Georgia, serif; }
  main { max-width: 1180px; margin: 24px auto; padding: 26px 30px; background: var(--paper);
         box-shadow: 0 0 0 1px #946a3c, 6px 8px 0 rgba(0,0,0,.35); outline: 1px solid rgba(58,38,20,.5); outline-offset: -8px; }
  h1 { color: var(--red); font-weight: 600; margin: 0 0 4px; }
  p.lede { margin: 4px 0 16px; color: var(--soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 22px 18px; }
  figure { margin: 0; }
  canvas { display: block; image-rendering: pixelated; outline: 2px solid var(--ink); width: 360px; height: 210px; }
  figcaption b { display: block; color: var(--red); font-weight: 600; margin-top: 6px; }
  figcaption span { color: var(--soft); font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>Map animations</h1>
<p class="lede">How events could play out on the map while history runs. Each panel loops. Pixel scale 3,
Aeon's palette; realms are the coloured territories. Sprites and timings are drafts to react to.</p>
<div class="grid" id="grid"></div>
</main>
<script>
"use strict";
/* ------------------------------------------------------------ palette and sprites */
const INK = "#2a1a0e", HALO = "#efe2bf", GOLD = "#e0b84f";
const SEA = ["#16295f", "#1f4294", "#3570c4"], FOAM = "#a6dbff", SAND = "#e6cd88", GRASS = ["#7da84a", "#6c9640"], TREE = "#2f6e45";
const REALM = { a: "#c0504d", b: "#4f81bd", c: "#9bbb59", d: "#8064a2" };
const W = 120, H = 70, S = 3;                             /* map pixels per panel, CSS px per map pixel */

function sprite(rows, pal) { return { rows: rows, pal: pal, w: rows[0].length, h: rows.length }; }
function blit(g, sp, x, y, over) {
  for (let j = 0; j < sp.h; j++) for (let i = 0; i < sp.w; i++) {
    const ch = sp.rows[j][i];
    if (ch === ".") continue;
    g.fillStyle = (over && over[ch]) || sp.pal[ch];
    g.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
  }
}
const ROOF = { k: INK, w: "#efe6d6", r: "#b5452e", g: "#b7b1a4", b: "#7a4a22", f: "#3a6ea5", F: "#244a73" };
const VILLAGE = sprite(["...k...", "..krk..", ".krrrk.", "krrrrrk", ".kwkwk.", ".kkkkk."], ROOF);
const KEEP = sprite(["......kff....", "......kfff...", "......kff....", "......k......", "..k.k.k.k.k..", "..kgkgkgkgk..",
                     "..kgggggggk..", "k.kgggggggk.k", "kgkgwwgwwgkgk", "kgkgggkgggkgk", "kgkggkbkggkgk", "kkkkkkkkkkkkk"], ROOF);
/* a soldier in its realm's tabard (f), with a spear; two walking frames */
const SOLDIER = [
  sprite(["....s", ".kk.s", ".kwks", "kffks", ".ffk.", ".kk..", ".k.k.", "k...k"], { k: INK, w: "#e8c9a0", f: "#888", s: "#c9ced6" }),
  sprite(["....s", ".kk.s", ".kwks", "kffks", ".ffk.", ".kk..", "..k..", ".kk.."], { k: INK, w: "#e8c9a0", f: "#888", s: "#c9ced6" }),
];
/* the banner bearer leading them */
const BANNER = sprite(["kfff", "kfff", "kff.", "k...", "kkk.", "kwk.", "kff.", "kk..", "k.k."], { k: INK, w: "#e8c9a0", f: "#888" });
/* a ship under its realm's sail, and its wake */
const SHIP = sprite(["....k....", "...kfk...", "..kfffk..", "..kfffk..", "...kfk...", "....k....", "kbbbbbbbk", ".kbbbbbk."], { k: INK, f: "#888", b: "#7a4a22" });
const CROWN = sprite(["k.k.k", "kykyk", "kyyyk", "kkkkk"], { k: INK, y: GOLD });
const OBELISK = sprite(["...k...", "..kyk..", "..kwk..", "..kwk..", ".kwwwk.", ".kwwwk.", "kkkkkkk"], { k: INK, y: GOLD, w: "#efe6d6" });
const SWORDS = sprite(["s.....s", ".s...s.", "..s.s..", "...s...", "..s.s..", "bk...kb", "b.....b"], { s: "#c9ced6", k: INK, b: "#7a4a22" });
const FLAG = sprite(["kff", "kff", "k..", "k..", "k.."], { k: INK, f: "#888" });
const PENNANT = sprite(["poooooooo.", "pfffffffo.", "pfffffffo.", "pfffffffo.", "pffffffo..", "pfffffffo.", "pfffffffo.", "pfffffffo.", "poooooooo.", "p.........", "p.........", "pp........"],
  { p: INK, o: INK, f: GOLD });
const GLYPH3 = ["kkk", "..k", ".kk", "..k", "kkk"];       /* the numeral on the pennant: age 3 */

/* the game project's speech bubble: an edge colour, a parchment fill and a tail pointing down at
   (x, y); it pops up from a little lower, then bobs a pixel every half second */
function bubble(g, x, y, edge, t, draw, w, h) {
  const lift = t < 90 ? -3 : t < 180 ? 1 : Math.floor(t / 500) % 2;
  const left = Math.round(x - w / 2), top = y - h - 3 + lift;
  g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(left + 1, top + 1, w, h);
  g.fillStyle = edge; g.fillRect(left, top, w, h); g.fillRect(x - 2, top + h, 3, 1); g.fillRect(x - 1, top + h + 1, 1, 2);
  g.fillStyle = HALO; g.fillRect(left + 1, top + 1, w - 2, h - 2); g.fillRect(x - 1, top + h - 1, 1, 2);
  draw(left, top);
}
/* the game project's four-frame twinkle: a dot, a small cross, a long cross, then its tips drifting */
function twinkle(g, x, y, a) {
  const f = Math.min(3, Math.floor(a * 4));
  g.fillStyle = f === 3 ? "rgba(255,248,225,.55)" : "#fff8e1";
  if (f < 3) g.fillRect(x, y, 1, 1);
  const from = f === 3 ? 2 : 1, to = [0, 1, 2, 3][f];
  for (let d = from; d <= to; d++) { g.fillRect(x - d, y, 1, 1); g.fillRect(x + d, y, 1, 1); g.fillRect(x, y - d, 1, 1); g.fillRect(x, y + d, 1, 1); }
}
function hash(a, b) { let h = Math.imul(a + 1, 374761393) ^ Math.imul(b + 7, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mix(c, d, t) {
  const p = function (h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const a = p(c), b = p(d);
  return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * t) + "," + Math.round(a[1] + (b[1] - a[1]) * t) + "," + Math.round(a[2] + (b[2] - a[2]) * t) + ")";
}
function ease(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

/* ------------------------------------------------------------ a little world per panel */
/* land: a few soft blobs; owners: the nearest realm seed within its reach */
function makeLand(blobs) {
  const land = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = -Infinity;
    for (const b of blobs) { const dx = (x - b[0]) / b[2], dy = (y - b[1]) / b[3]; v = Math.max(v, 1 - dx * dx - dy * dy); }
    v += (hash(x >> 1, y >> 1) - 0.5) * 0.18;
    land[y * W + x] = v > 0 ? 1 : 0;
  }
  return land;
}
function paintTerrain(g, land) {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    let near = 99;
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (land[ny * W + nx] !== land[i]) near = Math.min(near, Math.max(Math.abs(dx), Math.abs(dy)));
    }
    if (!land[i]) g.fillStyle = near === 1 ? ((x + y) % 2 ? FOAM : SEA[2]) : near <= 2 ? SEA[2] : near <= 3 ? SEA[1] : SEA[0];
    else g.fillStyle = near === 1 ? SAND : (x + y) % 2 ? GRASS[0] : GRASS[1];
    g.fillRect(x, y, 1, 1);
  }
  for (let k = 0; k < 40; k++) {
    const x = Math.floor(hash(k, 3) * W), y = Math.floor(hash(k, 4) * H);
    if (land[y * W + x] && land[Math.min(H - 1, y + 2) * W + x]) { g.fillStyle = TREE; g.fillRect(x, y, 2, 2); g.fillStyle = INK; g.fillRect(x, y + 2, 2, 1); }
  }
}
/* owners as a function: (x, y) -> realm key or null; drawn as a dithered wash with a dark border */
function paintRealms(g, land, ownerAt, flash) {
  const own = new Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) own[y * W + x] = land[y * W + x] ? ownerAt(x, y) : null;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, o = own[i];
    if (!o) continue;
    const col = REALM[o] || o;
    const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(function (d) { const nx = x + d[0], ny = y + d[1]; return nx >= 0 && ny >= 0 && nx < W && ny < H && land[ny * W + nx] && own[ny * W + nx] !== o; });
    const f = flash ? flash(x, y, o) : 0;
    if (edge) { g.fillStyle = mix(col, INK, 0.45); g.fillRect(x, y, 1, 1); }
    else if ((x + y) % 2 === 0 || f > 0) { g.globalAlpha = 0.5 + 0.5 * f; g.fillStyle = f > 0 ? mix(col, "#fff4d6", f * 0.6) : col; g.fillRect(x, y, 1, 1); g.globalAlpha = 1; }
  }
}
function nearestOwner(seeds) {
  return function (x, y) {
    let best = null, bd = Infinity;
    for (const s of seeds) { const d = Math.hypot(x - s.x, y - s.y); if (d <= s.r && d < bd) { bd = d; best = s.k; } }
    return best;
  };
}

/* ------------------------------------------------------------ the scenes */
const SCENES = [
  { title: "Expansion", note: "A realm grows outward; new land flashes in its colour and twinkles.", period: 5000,
    land: [[60, 35, 50, 30]],
    draw: function (g, land, t) {
      const r = 12 + 22 * ease(t / 3200);
      const seeds = [{ k: "a", x: 45, y: 34, r: r }, { k: "b", x: 92, y: 36, r: 18 }];
      paintRealms(g, land, nearestOwner(seeds), function (x, y, o) {
        if (o !== "a") return 0;
        const d = Math.hypot(x - 45, y - 34);
        return d > r - 3 ? Math.max(0, 1 - (r - d) / 3) * (0.6 + 0.4 * Math.sin(t / 80)) : 0;
      });
      if (t < 3600) for (let k = 0; k < 6; k++) {
        const a = hash(k, Math.floor(t / 600)) * 6.28, x = Math.round(45 + Math.cos(a) * (r - 1)), y = Math.round(34 + Math.sin(a) * (r - 1) * 0.8);
        if (land[y * W + x]) twinkle(g, x, y, (t % 600) / 600);
      }
      blit(g, KEEP, 39, 26, { f: REALM.a, F: mix(REALM.a, INK, 0.4) });
      blit(g, KEEP, 86, 28, { f: REALM.b, F: mix(REALM.b, INK, 0.4) });
    } },
  { title: "Collapse and split", note: "The far provinces flicker between old and new colours, then break away under their own border.", period: 5200,
    land: [[60, 35, 52, 28]],
    draw: function (g, land, t) {
      const k = t / 5200;
      paintRealms(g, land, function (x, y) {
        if (x < 64) return "d";
        if (k < 0.3) return "d";
        if (k < 0.6) return (Math.floor(t / 140) + (x >> 2) + (y >> 2)) % 2 ? "d" : "c";
        return "c";
      }, function (x, y, o) { return k > 0.6 && k < 0.75 && x >= 64 ? 1 - (k - 0.6) / 0.15 : 0; });
      if (k > 0.25 && k < 0.6) { g.fillStyle = INK; for (let y = 10; y < 62; y += 2) if (land[y * W + 64]) g.fillRect(64 + (hash(y, Math.floor(t / 120)) > 0.5 ? 1 : 0), y, 1, 2); }
      blit(g, KEEP, 30, 26, { f: REALM.d, F: mix(REALM.d, INK, 0.4) });
      if (k > 0.6) bubble(g, 90, 30, INK, t - 0.6 * 5200, function (l, tp) { blit(g, FLAG, l + 3, tp + 2, { f: REALM.c }); }, 9, 9);
    } },
  { title: "Invasion over land", note: "A war band marches from the capital to the target; dust and crossed swords for the clash; then the land changes hands.", period: 6000,
    land: [[60, 35, 54, 28]],
    draw: function (g, land, t) {
      const won = t > 4300;
      paintRealms(g, land, function (x, y) { return x < 58 ? "a" : (won && x < 82 ? "a" : "b"); },
        function (x, y, o) { return won && o === "a" && x >= 58 && x < 82 ? Math.max(0, 1 - (t - 4300) / 900) : 0; });
      blit(g, KEEP, 22, 26, { f: REALM.a, F: mix(REALM.a, INK, 0.4) });
      blit(g, VILLAGE, 72, 30);
      const p = ease(Math.min(1, t / 3000)), x0 = 34, x1 = 64, x = x0 + (x1 - x0) * p, y = 34;
      if (t < 4300) {
        const step = Math.floor(t / 160) % 2;
        blit(g, BANNER, x + 6, y - 2, { f: REALM.a });
        for (let i = 0; i < 3; i++) blit(g, SOLDIER[(step + i) % 2], x - i * 5, y + (i % 2), { f: REALM.a });
        for (let i = 0; i < 2; i++) blit(g, SOLDIER[(step + i + 1) % 2], 80 + i * 5, 33 + i, { f: REALM.b });
      }
      if (t > 3000 && t < 4300) {
        const a = (t - 3000) / 1300;
        g.fillStyle = "rgba(230,215,180,.8)";
        for (let k = 0; k < 14; k++) { const ang = hash(k, 9) * 6.28, d = 2 + a * 9 * hash(k, 10); g.fillRect(Math.round(74 + Math.cos(ang) * d), Math.round(36 + Math.sin(ang) * d * 0.6), 1, 1); }
        bubble(g, 74, 30, "#7a1010", t - 3000, function (l, tp) { blit(g, SWORDS, l + 2, tp + 2); }, 11, 11);
      }
    } },
  { title: "Invasion by sea", note: "Warships under the realm's sails cross from a port, leaving a wake; the troops land and the coast is taken.", period: 6500,
    land: [[22, 35, 24, 30], [100, 34, 24, 28]],
    draw: function (g, land, t) {
      const landed = t > 4200;
      paintRealms(g, land, function (x, y) { return x < 50 ? "a" : (landed && y < 40 ? "a" : "b"); },
        function (x, y, o) { return landed && o === "a" && x >= 50 ? Math.max(0, 1 - (t - 4200) / 900) : 0; });
      blit(g, KEEP, 12, 24, { f: REALM.a, F: mix(REALM.a, INK, 0.4) });
      blit(g, KEEP, 100, 40, { f: REALM.b, F: mix(REALM.b, INK, 0.4) });
      const p = ease(Math.min(1, t / 3800));
      for (let s = 0; s < 3; s++) {
        const x = 44 + 36 * p - s * 6, y = 22 + s * 7 + Math.round(Math.sin(t / 300 + s));
        if (t < 4400) {
          g.fillStyle = FOAM;
          for (let k = 1; k < 6; k++) if ((k + Math.floor(t / 150)) % 2) g.fillRect(Math.round(x - k * 2), Math.round(y + 7), 1, 1);
          blit(g, SHIP, x, y, { f: REALM.a });
        }
      }
      if (t > 3800 && t < 4600) { const step = Math.floor(t / 160) % 2; for (let i = 0; i < 3; i++) blit(g, SOLDIER[(step + i) % 2], 82 + i * 5, 22 + i * 3, { f: REALM.a }); }
    } },
  { title: "Exploration and a colony", note: "A lone ship sails to an empty shore; a flag goes up, and a village follows.", period: 6000,
    land: [[20, 35, 22, 30], [104, 30, 20, 22]],
    draw: function (g, land, t) {
      paintRealms(g, land, function (x, y) { return x < 50 ? "c" : (t > 4200 && Math.hypot(x - 100, y - 30) < 9 ? "c" : null); },
        function (x, y, o) { return t > 4200 && x >= 50 ? Math.max(0, 1 - (t - 4200) / 900) : 0; });
      blit(g, KEEP, 10, 24, { f: REALM.c, F: mix(REALM.c, INK, 0.4) });
      const p = ease(Math.min(1, t / 3500)), x = 40 + 46 * p, y = 30 + Math.round(Math.sin(t / 300));
      if (t < 3800) { g.fillStyle = FOAM; for (let k = 1; k < 6; k++) if ((k + Math.floor(t / 150)) % 2) g.fillRect(Math.round(x - k * 2), y + 7, 1, 1); blit(g, SHIP, x, y, { f: REALM.c }); }
      if (t > 3600) blit(g, FLAG, 96, 22 - Math.round(4 * ease((t - 3600) / 500)), { f: REALM.c });
      if (t > 4400) { blit(g, VILLAGE, 99, 28); if (t < 5200) twinkle(g, 102, 26, (t - 4400) / 800); }
    } },
  { title: "Entering a new age", note: "The game project's speech bubble over the capital, with the age's pennant; it pops up, then bobs.", period: 4500,
    land: [[60, 35, 50, 28]],
    draw: function (g, land, t) {
      paintRealms(g, land, function (x) { return x < 70 ? "b" : "a"; });
      blit(g, KEEP, 40, 28, { f: REALM.b, F: mix(REALM.b, INK, 0.4) });
      blit(g, KEEP, 86, 28, { f: REALM.a, F: mix(REALM.a, INK, 0.4) });
      if (t > 500 && t < 3800) bubble(g, 46, 26, GOLD, t - 500, function (l, tp) {
        blit(g, PENNANT, l + 3, tp + 2);
        g.fillStyle = INK; GLYPH3.forEach(function (row, j) { for (let i = 0; i < 3; i++) if (row[i] === "k") g.fillRect(l + 5 + i, tp + 3 + j, 1, 1); });
      }, 16, 16);
    } },
  { title: "The capital moves", note: "The crown arcs from the old seat to the new one, which is then flown the realm's colours.", period: 4500,
    land: [[60, 35, 54, 28]],
    draw: function (g, land, t) {
      paintRealms(g, land, function () { return "d"; });
      const moved = t > 2600, banner = { f: REALM.d, F: mix(REALM.d, INK, 0.4) };
      blit(g, moved ? sprite(["k.......k", "kk.krk.kk", "kgkrrrkgk", "kgkwwwkgk", "kgggggggk", "kggkbkggk", "kkkkkkkkk"], ROOF) : KEEP, moved ? 26 : 24, moved ? 30 : 26, banner);
      blit(g, moved ? KEEP : sprite(["k.......k", "kk.krk.kk", "kgkrrrkgk", "kgkwwwkgk", "kgggggggk", "kggkbkggk", "kkkkkkkkk"], ROOF), moved ? 84 : 86, moved ? 26 : 30, banner);
      if (t > 600 && t < 2700) {
        const p = ease((t - 600) / 2000), x = 30 + (90 - 30) * p, y = 24 - Math.sin(p * Math.PI) * 11;
        blit(g, CROWN, x - 2, y - 2);
        if (Math.floor(t / 100) % 2) twinkle(g, Math.round(x - 4), Math.round(y + 2), ((t / 100) % 1));
      }
      if (moved && t < 3400) twinkle(g, 90, 22, (t - 2600) / 800);
    } },
  { title: "A wonder is raised", note: "The obelisk rises out of the ground beside the city, with sparkles.", period: 4500,
    land: [[60, 35, 50, 28]],
    draw: function (g, land, t) {
      paintRealms(g, land, function () { return "b"; });
      blit(g, KEEP, 46, 28, { f: REALM.b, F: mix(REALM.b, INK, 0.4) });
      const p = ease((t - 600) / 1800), h = Math.round(OBELISK.h * p);
      if (h > 0) {
        g.save(); g.beginPath(); g.rect(62, 40 - h, 7, h); g.clip();
        blit(g, OBELISK, 62, 40 - OBELISK.h);
        g.restore();
      }
      if (t > 600 && t < 2600) { g.fillStyle = "rgba(230,215,180,.8)"; for (let k = 0; k < 6; k++) g.fillRect(61 + Math.round(hash(k, Math.floor(t / 120)) * 9), 40 + Math.round(hash(k + 9, Math.floor(t / 120)) * 2), 1, 1); }
      if (t > 2400 && t < 3600) for (let k = 0; k < 3; k++) twinkle(g, 60 + k * 5, 30 + (k % 2) * 4, ((t - 2400) / 1200 + k * 0.2) % 1);
    } },
];

/* ------------------------------------------------------------ run */
const grid = document.getElementById("grid");
const panels = SCENES.map(function (sc) {
  const fig = document.createElement("figure"), cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cap = document.createElement("figcaption");
  cap.innerHTML = "<b></b><span></span>";
  cap.querySelector("b").textContent = sc.title; cap.querySelector("span").textContent = sc.note;
  fig.appendChild(cv); fig.appendChild(cap); grid.appendChild(fig);
  const land = makeLand(sc.land), base = document.createElement("canvas");
  base.width = W; base.height = H;
  paintTerrain(base.getContext("2d"), land);
  return { sc: sc, g: cv.getContext("2d"), land: land, base: base };
});
/* ?t=1500 freezes every panel at that moment, to look at one frame */
const FIXED = /[?&]t=([0-9]+)/.exec(location.search);
function frame(now) {
  for (const p of panels) {
    const t = FIXED ? +FIXED[1] % p.sc.period : now % p.sc.period;
    p.g.drawImage(p.base, 0, 0);
    p.sc.draw(p.g, p.land, t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
