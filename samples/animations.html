<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeon — map animations</title>
<link rel="stylesheet" href="../css/pixelify.css">
<style>
  :root { --ink: #2a1a0e; --soft: #6b4a2a; --red: #8a3a22; --paper: #e9d6ad; }
  body { margin: 0; background: #2a1d12; color: var(--ink); font: 15px/1.4 "Pixelify Sans", Georgia, serif; }
  main { max-width: 1180px; margin: 24px auto; padding: 26px 30px; background: var(--paper);
         box-shadow: 0 0 0 1px #946a3c, 6px 8px 0 rgba(0,0,0,.35); outline: 1px solid rgba(58,38,20,.5); outline-offset: -8px; }
  h1 { color: var(--red); font-weight: 600; margin: 0 0 4px; }
  p.lede { margin: 4px 0 16px; color: var(--soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 22px 18px; }
  figure { margin: 0; }
  canvas { display: block; image-rendering: pixelated; outline: 2px solid var(--ink); width: 360px; height: 210px; }
  figcaption b { display: block; color: var(--red); font-weight: 600; margin-top: 6px; }
  figcaption span { color: var(--soft); font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>Map animations</h1>
<p class="lede">Second round. Realms are now made of cells and drawn with the map's own borders. Ships only sail from
ports and keep to open water; a landing takes a small beachhead first. Each panel loops; <code>?t=ms</code> freezes a frame and <code>?only=4</code> shows one panel large.</p>
<div class="grid" id="grid"></div>
</main>
<script>
"use strict";
/* ------------------------------------------------------------ palette and sprites */
const INK = "#2a1a0e", HALO = "#efe2bf", GOLD = "#e0b84f";
const SEA = ["#16295f", "#1f4294", "#3570c4"], FOAM = "#a6dbff", SAND = "#e6cd88", GRASS = ["#7da84a", "#6c9640"], TREE = "#2f6e45";
const REALM = { a: "#c0504d", b: "#4f81bd", c: "#9bbb59", d: "#8064a2", e: "#d9853b" };
const W = 120, H = 70;                                    /* map pixels per panel */

function sprite(rows, pal) {
  rows.forEach(function (r) { if (r.length !== rows[0].length) throw new Error("ragged sprite row: " + r); });
  return { rows: rows, pal: pal, w: rows[0].length, h: rows.length };
}
function blit(g, sp, x, y, over) {
  for (let j = 0; j < sp.h; j++) for (let i = 0; i < sp.w; i++) {
    const ch = sp.rows[j][i];
    if (ch === ".") continue;
    g.fillStyle = (over && over[ch]) || sp.pal[ch];
    g.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
  }
}
/* draw only the part of a sprite above a line (rising out of, or sinking into, ground or sea) */
function blitAbove(g, sp, x, y, line, over) {
  g.save(); g.beginPath(); g.rect(0, 0, W, line); g.clip(); blit(g, sp, x, y, over); g.restore();
}
const PAL = { k: INK, w: "#efe6d6", r: "#b5452e", g: "#b7b1a4", b: "#7a4a22", f: "#3a6ea5", F: "#244a73", y: GOLD, o: "#e8742a",
              c: "#ddd0aa", d: "#9a8a64", x: "#e3d3ad", s: "#b59d70", G: "#4f8a3a", t: "#8a7a5a" };
const VILLAGE = sprite(["...k...", "..krk..", ".krrrk.", "krrrrrk", ".kwkwk.", ".kkkkk."], PAL);
const TOWN = sprite(["......k....", ".....kgk...", "..k..kgk...", ".krk.kwk.k.", "krrrkkwkkrk", "kwwwkkwkkwk", "kwkwkkwkkwk", "kkkkkkkkkkk"], PAL);
const CITY = sprite(["k.k.....k.k", "kgk.k.k.kgk", "kgkkgkgkkgk", "kgggggggggk", "kgrrkgkrrgk", "kgwwkgkwwgk", "kgggkkkgggk", "kggkbbbkggk", "kkkkkkkkkkk"], PAL);
const KEEP = sprite(["......kff....", "......kfff...", "......kff....", "......k......", "..k.k.k.k.k..", "..kgkgkgkgk..",
                     "..kgggggggk..", "k.kgggggggk.k", "kgkgwwgwwgkgk", "kgkgggkgggkgk", "kgkggkbkggkgk", "kkkkkkkkkkkkk"], PAL);
const SEAT = sprite(["k.......k", "kk.krk.kk", "kgkrrrkgk", "kgkwwwkgk", "kgggggggk", "kggkbkggk", "kkkkkkkkk"], PAL);
/* a port: a town on the shore with a jetty and a moored mast flying the realm's colour; the jetty
   (the last four columns, row 6) reaches out over the water */
const PORT = sprite(["......k......", ".....kgk.....", "..k..kgk...k.", ".krk.kwk..kf.", "krrrkkwkk.kf.", "kwwwkkwkk.k..",
                     "kwkwkkwkkbbbb", "kkkkkkkkk.b.b"], PAL);
/* the camp a landing party pitches at the water's edge: a standard and two tents */
const CAMP = sprite(["kff.......", "kf....k...", "k....kck..", "k...kccdk.", "k..kcccddk", "kkkkkkkkkk"], PAL);
const RUIN = sprite(["k........k.", "kg.k.....kg", "kgkgk..k.kg", "kggg.k.kgkg", "kg.gg.kgg.g", "kkkkkkkkkkk"], PAL);
const RUBBLE = sprite(["....k......", "..kxk.k.kk.", ".kxsxkxkxsk", "kxsxxsxxsxk", "kkkkkkkkkkk"], PAL);
/* a soldier in its realm's tabard (f), with a spear; two walking frames */
const SOLDIER = [
  sprite(["....s", ".kk.s", ".kwks", "kffks", ".ffk.", ".kk..", ".k.k.", "k...k"], { k: INK, w: "#e8c9a0", f: "#888", s: "#c9ced6" }),
  sprite(["....s", ".kk.s", ".kwks", "kffks", ".ffk.", ".kk..", "..k..", ".kk.."], { k: INK, w: "#e8c9a0", f: "#888", s: "#c9ced6" }),
];
const BANNER = sprite(["kfff", "kfff", "kff.", "k...", "kkk.", "kwk.", "kff.", "kk..", "k.k."], { k: INK, w: "#e8c9a0", f: "#888" });
const SHIP = sprite(["....k....", "...kfk...", "..kfffk..", "..kfffk..", "...kfk...", "....k....", "kbbbbbbbk", ".kbbbbbk."], { k: INK, f: "#888", b: "#7a4a22" });
const CROWN = sprite(["k.k.k", "kykyk", "kyyyk", "kkkkk"], PAL);
const FLAG = sprite(["kff", "kff", "k..", "k..", "k.."], { k: INK, f: "#888" });

/* new-age symbols, to choose from */
const AGE = [
  { name: "rising sun", sp: sprite(["y...y...y", ".y..y..y.", "...yyy...", "..yyyyy..", ".yyyyyyy.", "kkkkkkkkk", ".k..k..k."], PAL) },
  { name: "hourglass", sp: sprite(["kkkkkkk", ".kwwwk.", ".kyyyk.", "..kyk..", "...y...", "..kyk..", ".kwyyk.", ".kyyyk.", "kkkkkkk"], PAL) },
  { name: "laurels and numeral", sp: sprite(["..GG...GG..", ".GG.....GG.", "GG.k.k.k.GG", "G..k.k.k..G", "GG.k.k.k.GG", ".GG.....GG.", "..GG.r.GG..", "....rrr...."], PAL) },
  { name: "open book", sp: sprite([".kkk..kkk.", "kwwwkkwwwk", "kwttkkwttk", "kwwwkkwwwk", "kwttkkwttk", "kwwwkkwwwk", ".kkkkkkkk."], PAL) },
];
/* wonder designs, to choose from */
const WONDERS = [
  { name: "ziggurat", sp: sprite(["....kyk....", "...kkkkk...", "...kxxsk...", "..kkkkkkk..", "..kxxxxsk..", ".kkkkkkkkk.", ".kxxkbkxsk.", "kkkkkkkkkkk"], PAL) },
  { name: "lighthouse", sp: sprite(["..oyo..", ".koyok.", ".kkkkk.", "..kxk..", "..krk..", "..kxk..", "..krk..", ".kxxsk.", ".krrrk.", ".kxxsk.", "kxxbxsk", "kkkkkkk"], PAL) },
  { name: "domed hall", sp: sprite(["......y......", "....kkkkk....", "...kxxxxsk...", "..kxxxxxssk..", ".kkkkkkkkkkk.", ".kxkxkxkxkxk.", ".kxkxkxkxkxk.", ".kxkxkbkxkxk.", "kkkkkkkkkkkkk"], PAL) },
  { name: "Greek temple", sp: sprite(["......kkkk......", "....kkxxxxkk....", "..kkxxxxxxxxkk..", ".kkkkkkkkkkkkkk.", ".kxxxxxxxxxxxxk.", ".kkkkkkkkkkkkkk.", ".xsnxsnxsnxsnxs.", ".xsnxsnxsnxsnxs.", ".xsnxsnxsnxsnxs.", ".xsnxsnxsnxsnxs.", "kkkkkkkkkkkkkkkk", "kxxxxxxxxxxxxxsk", "kkkkkkkkkkkkkkkk"], PAL) },
];
/* Greek and Roman wonders, more to choose from (e: bronze) */
PAL.e = "#a87a3a"; PAL.n = "#4a3c2c";
const CLASSICAL = [
  { name: "colosseum", sp: sprite(["..kkkkkkkkk....", ".kxkxkxkxkxk...", "kxxxxxxxxxxxkk.", "kxkxkxkxkxkxkxk", "kxxxxxxxxxxxxsk", "kxkxkxkxkxkxkxk", "kxxxxxxxxxxxxsk", "kkkkkkkkkkkkkkk"], PAL) },
  { name: "triumphal arch", sp: sprite(["...kykyk...", "kkkkkkkkkkk", "kxxxxyxxxsk", "kkkkkkkkkkk", "kxxkkkkkxsk", "kxk.....ksk", "kxk.....ksk", "kxk.....ksk", "kxk.....ksk", "kkk.....kkk"], PAL) },
  { name: "colossus", sp: sprite(["o......", "y.kyk..", "k.kek..", "kkkekk.", "..keek.", "..keek.", "..keek.", "..kekek", "..kekek", ".kkkkkk", ".kxxsk.", ".kxxsk.", "kkkkkkk"], PAL) },
  { name: "obelisk", sp: sprite(["....k....", "...kyk...", "..kyyok..", "..kxxsk..", "..kxtsk..", "..kxxsk..", "..kxxsk..", "..ktxsk..", "..kxxsk..", "..kxxsk..", "..kxtsk..", "..kxxsk..", ".kkkkkkk.", ".kxxxxsk.", "kkkkkkkkk", "kxxxxxxsk", "kkkkkkkkk"], PAL) },
];
/* capital designs, to choose from (f / F: the realm's colour) */
const CAPITALS = [
  { name: "domed palace", sp: sprite([".......k.......", "......kyk......", ".....kfffk.....", "....kfffFFk....", "..k.kkkkkkk.k..", ".kfkkgwgwgkkfk.", ".kgkkgggggkkgk.", ".kgkkgwgwgkkgk.", "kkgkkgggggkkgkk", "kgggggkbkgggggk", "kkkkkkkkkkkkkkk"], PAL) },
  { name: "citadel tower", sp: sprite(["......kff....", "......kfff...", "......k......", "....k.k.k....", "....kgggk....", "....kgwgk....", "....kgggk....", "k.k.kgwgk.k.k", "kgkkkgggkkkgk", "kgggggggggggk", "kggwgkbkgwggk", "kkkkkkkkkkkkk"], PAL) },
  { name: "great hall", sp: sprite([".......kff.....", ".......kf......", ".......k.......", "....kkkfkkk....", "...kfffffffk...", "..kfffffffffk..", ".kkkkkkkkkkkkk.", "krrkkwkwkwkkrrk", "kwwkkwwwwwkkwwk", "kwbkkwwbwwkkwbk", "kkkkkkkkkkkkkkk"], PAL) },
  { name: "crowned city", sp: CITY, crown: true },
];
/* Daan's pick: the domed palace is every capital */
const PALACE = CAPITALS[0].sp;
/* the age a realm has reached, I to V, inside laurels (Daan's pick of the new-age symbols) */
const NUMERAL = { 1: ["..k..", "..k..", "..k.."], 2: [".k.k.", ".k.k.", ".k.k."], 3: ["k.k.k", "k.k.k", "k.k.k"],
                  4: ["k.k.k", "k.k.k", "k..k."], 5: [".k.k.", ".k.k.", "..k.."] };
function laurels(n) {
  const N = NUMERAL[n];
  return sprite(["..GG...GG..", ".GG.....GG.", "GG." + N[0] + ".GG", "G.." + N[1] + "..G", "GG." + N[2] + ".GG", ".GG.....GG.", "..GG.r.GG..", "....rrr...."], PAL);
}
/* ruins, one per kind of settlement */
const RUINS = {
  village: sprite(["..k....", ".kb.k..", "kbbkbk.", "kkkkkkk"], PAL),
  town: sprite(["......k....", ".....kg....", "..k..kg..k.", ".kbk.kgk.kb", "kbbkkkgkkbk", "kkkkkkkkkkk"], PAL),
  city: RUIN,
  palace: sprite([".....kk.k......", "....kgk.kgk....", "..k.kgkkkgk.k..", ".kgk.kg.gk.kgk.", ".kgkkgg.ggkkg..", "kkgkkgggggkkgkk", "kgggggk.kgggggk", "kkkkkkkkkkkkkkk"], PAL),
  capital: sprite(["......k......", "....k.kg.....", "....kgkg.k...", "k...kggg.kg.k", "kg.kkgggkkg.k", "kgkgggkgggkgk", "kgkggk.kggkgk", "kkkkkkkkkkkkk"], PAL),
  port: sprite(["......k......", ".....kg......", "..k..kg......", ".kbk.kgk.....", "kbbkkkgkk....", "kkkkkkkkkb.b.", ".........b..b"], PAL),
};
/* a settlement set on fire: flames spread over the roofs, smoke rises, it falls in with a burst
   of dust, and the ruin keeps smoking a while. t runs from when the fire starts. */
function razed(g, sp, ruin, x, base, t, over) {
  if (t < 0) { blit(g, sp, x, base - sp.h, over); return; }
  if (t < 2000) {
    blit(g, sp, x, base - sp.h, over);
    flames(g, x + 1, base - sp.h + 3 + (t < 700 ? 1 : 0), t < 700 ? Math.ceil(sp.w / 3) : sp.w - 2, t + x * 31);
    if (t > 1500) dust(g, x - 1, base - 1, sp.w + 2, t + x);
  } else {
    blit(g, ruin, x, base - ruin.h);
    if (t < 2800) { dust(g, x - 2, base - 1, sp.w + 4, t + x); dust(g, x - 1, base - 4, sp.w + 2, t + x + 60); }
  }
  if (t > 200 && t < 4600) smoke(g, x + (sp.w >> 1), base - sp.h + 2, t + x * 37, t < 2000 ? 8 : 4, sp.w - 2);
}
function tab(k) { return { f: REALM[k], F: mix(REALM[k], INK, 0.4) }; }

/* the game project's speech bubble: an edge colour, a parchment fill and a tail pointing down at
   (x, y); it pops up from a little lower, then bobs a pixel every half second */
function bubble(g, x, y, edge, t, draw, w, h) {
  const lift = t < 90 ? -3 : t < 180 ? 1 : Math.floor(t / 500) % 2;
  const left = Math.round(x - w / 2), top = y - h - 3 + lift;
  g.fillStyle = "rgba(0,0,0,.35)"; g.fillRect(left + 1, top + 1, w, h);
  g.fillStyle = edge; g.fillRect(left, top, w, h); g.fillRect(x - 2, top + h, 3, 1); g.fillRect(x - 1, top + h + 1, 1, 2);
  g.fillStyle = HALO; g.fillRect(left + 1, top + 1, w - 2, h - 2); g.fillRect(x - 1, top + h - 1, 1, 2);
  draw(left, top);
}
/* the game project's four-frame twinkle: a dot, a small cross, a long cross, then its tips drifting */
function twinkle(g, x, y, a) {
  if (a < 0 || a >= 1) return;
  const f = Math.min(3, Math.floor(a * 4));
  g.fillStyle = f === 3 ? "rgba(255,248,225,.55)" : "#fff8e1";
  if (f < 3) g.fillRect(x, y, 1, 1);
  const from = f === 3 ? 2 : 1, to = [0, 1, 2, 3][f];
  for (let d = from; d <= to; d++) { g.fillRect(x - d, y, 1, 1); g.fillRect(x + d, y, 1, 1); g.fillRect(x, y - d, 1, 1); g.fillRect(x, y + d, 1, 1); }
}
function hash(a, b) { let h = Math.imul(a + 1, 374761393) ^ Math.imul(b + 7, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function rgbOf(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(c, d, t) {
  const a = rgbOf(c), b = rgbOf(d);
  return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * t) + "," + Math.round(a[1] + (b[1] - a[1]) * t) + "," + Math.round(a[2] + (b[2] - a[2]) * t) + ")";
}
function ease(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
function clamp01(t) { return Math.max(0, Math.min(1, t)); }
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function bayer(x, y) { return (BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16; }

/* ------------------------------------------------------------ effects */
/* a cartoon scuffle: a boiling dust cloud with fists, feet and blades poking out, and stars */
function brawl(g, cx, cy, t, r) {
  const f = Math.floor(t / 90), C = [];
  for (let k = 0; k < 6; k++) {
    const a = k / 5 * 6.28 + hash(k, f) * 0.8, d = k ? r * 0.5 : 0;
    C.push([cx + Math.cos(a) * d + (hash(k, f + 3) - 0.5) * 1.5, cy + Math.sin(a) * d * 0.7, r * (0.48 + 0.2 * hash(k, f + 7))]);
  }
  const inside = function (x, y) { return C.some(function (c) { return (x + 0.5 - c[0]) ** 2 + (y + 0.5 - c[1]) ** 2 <= c[2] * c[2]; }); };
  for (let y = Math.floor(cy - r - 2); y <= cy + r + 2; y++) for (let x = Math.floor(cx - r - 3); x <= cx + r + 3; x++) {
    if (!inside(x, y)) continue;
    const edge = !inside(x + 1, y) || !inside(x - 1, y) || !inside(x, y + 1) || !inside(x, y - 1);
    g.fillStyle = edge ? INK : y > cy + r * 0.25 ? "#cdbf9c" : "#efe4c8";
    g.fillRect(x, y, 1, 1);
  }
  for (let k = 0; k < 3; k++) {                           /* limbs and blades */
    const a = hash(k, f + 11) * 6.28, ux = Math.cos(a), uy = Math.sin(a);
    let d = 0;
    while (d < r + 4 && inside(Math.round(cx + ux * d), Math.round(cy + uy * d))) d++;
    for (let s = 0; s < 3; s++) {
      g.fillStyle = s === 2 ? (k === 0 ? "#c9ced6" : "#e8c9a0") : INK;
      g.fillRect(Math.round(cx + ux * (d + s)), Math.round(cy + uy * (d + s)), 1, 1);
    }
  }
  for (let k = 0; k < 2; k++) {                           /* stars */
    const a = hash(k, f + 21) * 6.28, x = Math.round(cx + Math.cos(a) * (r + 2)), y = Math.round(cy + Math.sin(a) * (r + 1));
    g.fillStyle = GOLD; g.fillRect(x, y - 1, 1, 3); g.fillRect(x - 1, y, 3, 1);
  }
}
function flames(g, x, y, w, t) {
  for (let i = 0; i < w; i++) {
    const h = Math.floor(hash(i, Math.floor(t / 90) + x) * 4);
    if (!h) continue;
    g.fillStyle = PAL.o; g.fillRect(x + i, y - h, 1, h);
    g.fillStyle = GOLD; g.fillRect(x + i, y - 1, 1, 1);
  }
}
function smoke(g, x, y, t, n, spread) {
  for (let k = 0; k < n; k++) {
    const age = (t / 1400 + hash(k, 1)) % 1, px = x + (hash(k, 2) - 0.5) * spread + Math.sin(age * 6 + k) * 1.5, py = y - age * 14;
    g.fillStyle = "rgba(70,62,58," + (0.65 * (1 - age)).toFixed(2) + ")";
    const s = age > 0.45 ? 2 : 1;
    g.fillRect(Math.round(px), Math.round(py), s, s);
  }
}
function dust(g, x, y, w, t) {
  g.fillStyle = "rgba(230,215,180,.85)";
  for (let k = 0; k < 8; k++) g.fillRect(x + Math.round(hash(k, Math.floor(t / 120)) * w), y + Math.round(hash(k + 9, Math.floor(t / 120)) * 3) - 1, 1, 1);
}

/* ------------------------------------------------------------ a little world per panel */
/* land: a few soft blobs */
function makeLand(blobs) {
  const land = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = -Infinity;
    for (const b of blobs) { const dx = (x - b[0]) / b[2], dy = (y - b[1]) / b[3]; v = Math.max(v, 1 - dx * dx - dy * dy); }
    v += (hash(x >> 1, y >> 1) - 0.5) * 0.18;
    land[y * W + x] = v > 0 ? 1 : 0;
  }
  return land;
}
/* cells: like the map's regions, every pixel belongs to its nearest jittered seed; realms own cells */
function makeCells(land) {
  const STEP = 8, cells = [], cellOf = new Int16Array(W * H);
  for (let gy = 0; gy * STEP < H + STEP; gy++) for (let gx = 0; gx * STEP < W + STEP; gx++) {
    const x = gx * STEP + hash(gx, gy + 40) * 7, y = gy * STEP + hash(gx + 40, gy) * 7;
    /* u: x with a wobble, so a split along "u < 60" makes a ragged border like the map's */
    cells.push({ i: cells.length, gx: gx, gy: gy, x: x, y: y, u: x + (hash(gx + 90, gy + 90) - 0.5) * 16 });
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let best = 0, bd = Infinity;
    for (const c of cells) { const d = (x - c.x) ** 2 + (y - c.y) ** 2; if (d < bd) { bd = d; best = c.i; } }
    cellOf[y * W + x] = best;
  }
  return { cells: cells, cellOf: cellOf };
}
/* distance from land, in pixels, for every water pixel (land is 0) */
function makeDepth(land) {
  const D = new Int16Array(W * H).fill(-1), q = [];
  for (let i = 0; i < W * H; i++) if (land[i]) { D[i] = 0; q.push(i); }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % W, y = (i - x) / W;
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
      const nx = x + d[0], ny = y + d[1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) return;
      const j = ny * W + nx;
      if (D[j] < 0) { D[j] = D[i] + 1; q.push(j); }
    });
  }
  return D;
}
/* a sea lane between two points that keeps to open water, smoothed */
function seaPath(P, a, b) {
  const ok = function (i) { return P.depth[i] >= 5; };
  const near = function (p) {
    let best = -1, bd = Infinity;
    for (let i = 0; i < W * H; i++) if (ok(i)) { const d = (i % W - p[0]) ** 2 + (Math.floor(i / W) - p[1]) ** 2; if (d < bd) { bd = d; best = i; } }
    return best;
  };
  const s = near(a), e = near(b), prev = new Int32Array(W * H).fill(-1), q = [s];
  prev[s] = s;
  for (let h = 0; h < q.length && prev[e] < 0; h++) {
    const i = q[h], x = i % W, y = (i - x) / W;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {

      const base = 44;
      WONDERS.forEach(function (wd, k) {
        const sp = wd.sp, x = 14 + k * 28 - (sp.w >> 1), p = ease((t - 400 - k * 450) / 1600), h = Math.round(sp.h * p);
        const fire = Math.floor(t / 150) % 2 ? { o: GOLD, y: PAL.o } : null;
        if (h > 0) { g.save(); g.beginPath(); g.rect(x, base - h, sp.w, h); g.clip(); blit(g, sp, x, base - sp.h, fire); g.restore(); }
        if (p > 0 && p < 1) dust(g, x - 1, base, sp.w + 2, t + k * 50);
        twinkle(g, x + (sp.w >> 1), base - sp.h - 2, (t - 2200 - k * 450) / 800);
      });
    } },

  { title: "Greek and Roman wonders", note: "More to choose from, left to right: a colosseum, a triumphal arch, a colossus, an obelisk.", period: 6500,
    land: [[60, 35, 56, 28]],
    draw: function (g, P, t) {
      paintRealms(g, P, function () { return "d"; });
      const base = 44, X = [10, 40, 70, 94];
      CLASSICAL.forEach(function (wd, k) {
        const sp = wd.sp, x = X[k], p = ease((t - 400 - k * 450) / 1600), h = Math.round(sp.h * p);
        const fire = Math.floor(t / 150) % 2 ? { o: GOLD, y: PAL.o } : null;
        if (h > 0) { g.save(); g.beginPath(); g.rect(x, base - h, sp.w, h); g.clip(); blit(g, sp, x, base - sp.h, fire); g.restore(); }
        if (p > 0 && p < 1) dust(g, x - 1, base, sp.w + 2, t + k * 50);
        twinkle(g, x + (sp.w >> 1), base - sp.h - 2, (t - 2200 - k * 450) / 800);
      });
    } },

  { title: "Settlements destroyed", note: "Each kind burns and leaves its own ruin, which stays on the map: a village, a town, a city, the capital (the domed palace), a port with its broken jetty.", period: 7000,
    land: [[54, 36, 50, 26]],
    setup: function (P) { P.base = 41; P.px = shore(P, P.base - 2, W - 1, -1); },
    draw: function (g, P, t) {
      paintRealms(g, P, function () { return "a"; });
      const B = P.base, L = [
        [VILLAGE, RUINS.village, 10, null], [TOWN, RUINS.town, 23, null], [CITY, RUINS.city, 39, null],
        [PALACE, RUINS.palace, 55, tab("a")], [PORT, RUINS.port, P.px - 8, tab("a")]];
      L.forEach(function (e, k) { razed(g, e[0], e[1], e[2], B, t - 600 - k * 350, e[3]); });
    } },

  { title: "A wonder is destroyed", note: "The wonder shakes and cracks, then sinks into its own dust and leaves rubble.", period: 7000,
    land: [[60, 35, 54, 28]],
    draw: function (g, P, t) {
      paintRealms(g, P, function () { return "b"; });
      blit(g, PALACE, 30, 26, tab("b"));
      const sp = WONDERS[2].sp, x = 56, base = 38;
      if (t < 2200) {
        const shake = t > 1000 ? (Math.floor(t / 60) % 2 ? 1 : 0) : 0;
        blit(g, sp, x + shake, base - sp.h);
        g.fillStyle = INK;                                 /* cracks spreading down the walls */
        const n = Math.floor(clamp01((t - 900) / 1200) * 10);
        for (let k = 0; k < n; k++) g.fillRect(x + shake + 2 + Math.floor(hash(k, 31) * 9), base - sp.h + 2 + Math.floor(hash(k, 32) * 6), 1, 1);
      } else if (t < 3400) {
        const drop = Math.round(ease((t - 2200) / 1200) * sp.h);
        blitAbove(g, sp, x, base - sp.h + drop, base);
        dust(g, x - 3, base - 1, sp.w + 6, t); dust(g, x - 1, base - 4, sp.w + 2, t + 50);
        g.fillStyle = PAL.x;                               /* stones flung out */
        const a = ((t - 2200) % 600) / 600;
        for (let k = 0; k < 4; k++) { const d = k < 2 ? -1 : 1; g.fillRect(Math.round(x + 6 + d * (3 + a * 8 + k)), Math.round(base - 6 - Math.sin(a * Math.PI) * 5 + k), 1, 1); }
      }
      if (t >= 3000) blit(g, RUBBLE, x + 1, base - RUBBLE.h);
      if (t >= 3400 && t < 4400) dust(g, x - 2, base - 1, sp.w + 4, t);
    } },
];

/* ------------------------------------------------------------ run */
const grid = document.getElementById("grid");
/* ?only=4 shows just the fourth panel, three times larger */
const ONLY = /[?&]only=([0-9]+)/.exec(location.search);
if (ONLY) { grid.style.display = "block"; document.head.insertAdjacentHTML("beforeend", "<style>canvas { width: 1080px; height: 630px; }</style>"); }
const panels = SCENES.filter(function (sc, k) { return !ONLY || k === +ONLY[1] - 1; }).map(function (sc) {
  const fig = document.createElement("figure"), cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const cap = document.createElement("figcaption");
  cap.innerHTML = "<b></b><span></span>";
  cap.querySelector("b").textContent = sc.title; cap.querySelector("span").textContent = sc.note;
  fig.appendChild(cv); fig.appendChild(cap); grid.appendChild(fig);
  const land = makeLand(sc.land), cl = makeCells(land), base = document.createElement("canvas");
  base.width = W; base.height = H;
  paintTerrain(base.getContext("2d"), land);
  const P = { land: land, cells: cl.cells, cellOf: cl.cellOf, depth: makeDepth(land) };
  if (sc.setup) sc.setup(P);
  return { sc: sc, g: cv.getContext("2d", { willReadFrequently: true }), P: P, base: base };
});
/* ?t=1500 freezes every panel at that moment, to look at one frame */
const FIXED = /[?&]t=([0-9]+)/.exec(location.search);
function frame(now) {
  for (const p of panels) {
    const t = FIXED ? +FIXED[1] % p.sc.period : now % p.sc.period;
    p.P.t = t;
    p.g.drawImage(p.base, 0, 0);
    p.sc.draw(p.g, p.P, t);
  }
  if (!FIXED) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
