<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aeon — Low poly sample (The Long Dark)</title>
<style>
  html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden;
    font-family: "Cascadia Mono", Consolas, "Courier New", monospace; color: #8fefff; }
  canvas { display: block; position: absolute; inset: 0; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hud { position: absolute; pointer-events: none; }
  .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120,240,255,.025) 0 1px, transparent 1px 3px); }
  .title { left: 6vw; top: 12vh; }
  .title h1 { margin: 0; font-weight: 300; font-size: 54px; letter-spacing: 12px; color: #e6fbff;
    text-shadow: 0 0 18px rgba(94,242,255,.55); font-family: "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; }
  .title .sub { margin-top: 10px; font-size: 12px; letter-spacing: 4px; color: #5ef2ff; opacity: .85; }
  .title .rule { width: 340px; height: 1px; margin-top: 18px; background: linear-gradient(90deg,#5ef2ff,transparent); }
  .menu { left: 6vw; top: 40vh; pointer-events: auto; }
  .menu button { display: flex; align-items: center; gap: 14px; width: 300px; padding: 13px 16px; margin-bottom: 6px;
    background: rgba(8,30,40,.35); border: 1px solid rgba(94,242,255,.18); color: #bff6ff; cursor: pointer;
    font: inherit; font-size: 13px; letter-spacing: 3px; text-align: left; transition: .15s;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
  .menu button:hover, .menu button.on { background: rgba(94,242,255,.14); border-color: #5ef2ff; color: #fff;
    box-shadow: inset 3px 0 0 #5ef2ff; }
  .menu button i { font-style: normal; color: #5ef2ff; opacity: .7; font-size: 11px; }
  .panel { right: 4vw; bottom: 12vh; width: 270px; padding: 14px 16px; font-size: 11px; line-height: 1.9;
    background: rgba(4,18,26,.55); border: 1px solid rgba(94,242,255,.22); }
  .panel b { color: #e6fbff; font-weight: 400; }
  .panel .row { display: flex; justify-content: space-between; }
  .panel .h { color: #5ef2ff; letter-spacing: 3px; margin-bottom: 6px; font-size: 10px; }
  .bar { height: 3px; background: rgba(94,242,255,.15); margin: 3px 0 7px; }
  .bar > i { display: block; height: 100%; background: #5ef2ff; }
  .corner { position: absolute; width: 22px; height: 22px; border-color: rgba(94,242,255,.55); border-style: solid; }
  .tl { left: 18px; top: 18px; border-width: 1px 0 0 1px; } .tr { right: 18px; top: 18px; border-width: 1px 1px 0 0; }
  .bl { left: 18px; bottom: 18px; border-width: 0 0 1px 1px; } .br { right: 18px; bottom: 18px; border-width: 0 1px 1px 0; }
  .ticker { left: 6vw; bottom: 9vh; font-size: 11px; color: #5ef2ff; opacity: .75; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div class="hud title">
  <h1>THE LONG DARK</h1>
  <div class="sub">A SURVEY OF 11,800 YEARS</div>
  <div class="rule"></div>
</div>

<div class="hud menu">
  <button class="on" id="go"><i>01</i>INITIATE SURVEY</button>
  <button><i>02</i>RESUME ARCHIVE</button>
  <button><i>03</i>STAR CATALOGUE</button>
  <button><i>04</i>PARAMETERS</button>
</div>

<div class="hud panel" id="panel"></div>
<div class="hud ticker" id="ticker"></div>

<script src="../js/rng.js"></script>
<script src="../js/planetgen.js"></script>
<script src="../js/worldgen.js"></script>
<script src="common.js"></script>
<script>
(function () {
"use strict";

const seed = SAMPLE.nav("lowpoly.html");
const world = SAMPLE.makeWorld(seed);
const rng = AEON.RNG(seed + ":lowpoly");
const W = world.width, H = world.height;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* ========================================================== icosphere === */
function icosphere(level) {
  const t = (1 + Math.sqrt(5)) / 2;
  let verts = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t],
               [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(norm);
  let faces = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
               [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  for (let l = 0; l < level; l++) {
    const cache = {}, next = [];
    const mid = function (a, b) {
      const k = a < b ? a + "_" + b : b + "_" + a;
      if (cache[k] === undefined) {
        const va = verts[a], vb = verts[b];
        verts.push(norm([(va[0] + vb[0]) / 2, (va[1] + vb[1]) / 2, (va[2] + vb[2]) / 2]));
        cache[k] = verts.length - 1;
      }
      return cache[k];
    };
    for (const f of faces) {
      const a = mid(f[0], f[1]), b = mid(f[1], f[2]), c = mid(f[2], f[0]);
      next.push([f[0], a, c], [f[1], b, a], [f[2], c, b], [a, b, c]);
    }
    faces = next;
  }
  return { verts: verts, faces: faces };
}
function norm(v) { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }

/* sphere direction -> fractional grid coords (equirectangular) */
function uv(p) {
  const lon = Math.atan2(p[2], p[0]), lat = Math.asin(Math.max(-1, Math.min(1, p[1])));
  return [(lon + Math.PI) / (2 * Math.PI) * W, (Math.PI / 2 - lat) / Math.PI * H];
}
/* hide the east/west seam: within a band near the edge, cross-fade into column 0 */
const BAND = 6;
function elevWrapped(u, v) {
  const e = SAMPLE.field(world, "elevation", u, v);
  if (u < W - BAND) return e;
  const k = (u - (W - BAND)) / BAND;
  return e * (1 - k) + SAMPLE.field(world, "elevation", 0.5, v) * k;
}

const sphere = icosphere(4);
const V = sphere.verts.map(function (p) {
  const g = uv(p);
  const e = elevWrapped(g[0], g[1]);
  const r = e > 0.5 ? 1 + (e - 0.5) * 0.26 : 1 - (0.5 - e) * 0.03;
  return { p: [p[0] * r, p[1] * r, p[2] * r], e: e };
});

const PAL = {
  grassland: [104, 168, 112], forest: [47, 112, 92], jungle: [38, 138, 110], savanna: [170, 164, 92],
  desert: [204, 146, 92], swamp: [74, 98, 82], taiga: [62, 108, 104], tundra: [146, 166, 162],
  ice: [222, 236, 244], mountain: [122, 116, 132], snow: [240, 245, 250],
};
const F = sphere.faces.map(function (f) {
  const a = V[f[0]], b = V[f[1]], c = V[f[2]];
  const cx = (a.p[0] + b.p[0] + c.p[0]) / 3, cy = (a.p[1] + b.p[1] + c.p[1]) / 3, cz = (a.p[2] + b.p[2] + c.p[2]) / 3;
  const e = (a.e + b.e + c.e) / 3;
  let col;
  if (e <= 0.5) {
    const d = Math.min(1, (0.5 - e) * 9);
    col = [Math.round(14 - d * 8), Math.round(84 - d * 46), Math.round(104 - d * 40)];
  } else {
    const g = uv(norm([cx, cy, cz]));
    const cell = SAMPLE.cell(world, g[0], g[1]);
    const key = cell.barren ? "grassland" : (cell.biome === "mountain" && e > 0.84 ? "snow" : cell.biome);
    col = (PAL[key] || PAL.grassland).slice();
  }
  /* face normal from the cross product — this is what makes it read as faceted */
  const ux = b.p[0] - a.p[0], uy = b.p[1] - a.p[1], uz = b.p[2] - a.p[2];
  const vx = c.p[0] - a.p[0], vy = c.p[1] - a.p[1], vz = c.p[2] - a.p[2];
  const n = norm([uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx]);
  if (n[0] * cx + n[1] * cy + n[2] * cz < 0) { n[0] = -n[0]; n[1] = -n[1]; n[2] = -n[2]; }
  return { i: f, n: n, c: [cx, cy, cz], col: col, land: e > 0.5 };
});

/* city lights for the night side */
const lights = SAMPLE.sites(world, 40, 4, rng).map(function (r) {
  const lon = (r.x + 0.5) / W * 2 * Math.PI - Math.PI, lat = Math.PI / 2 - (r.y + 0.5) / H * Math.PI;
  return { p: [Math.cos(lat) * Math.cos(lon) * 1.01, Math.sin(lat) * 1.01, Math.cos(lat) * Math.sin(lon) * 1.01],
           s: 0.6 + r.habitability * 1.6 };
});
const capital = lights[0];
const capitalName = SAMPLE.name(rng, "scifi").toUpperCase();

/* stars + a faint galaxy smear behind everything */
const stars = [];
for (let k = 0; k < 520; k++) stars.push([rng.next(), rng.next(), rng.range(0.2, 1.4), rng.range(0, 6.3)]);
const galaxy = [];
for (let k = 0; k < 900; k++) {
  const arm = rng.int(0, 1), r = Math.pow(rng.next(), 0.6), th = r * 7 + arm * Math.PI + rng.gauss() * 0.35;
  galaxy.push([Math.cos(th) * r, Math.sin(th) * r * 0.42, rng.range(0.3, 1.1)]);
}

/* ============================================================ render === */
let yaw = 0.6, pitch = -0.32, dragging = false, lastX = 0, lastY = 0, vel = 0.0016;
const tilt = 0.41;
const L = norm([-0.55, 0.35, 0.76]);

function rot(p) {
  /* axial tilt, then spin (yaw), then view pitch */
  let x = p[0], y = p[1], z = p[2];
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  let x1 = x * cy + z * sy, z1 = -x * sy + z * cy; x = x1; z = z1;
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  let x2 = x * ct - y * st, y2 = x * st + y * ct; x = x2; y = y2;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let y3 = y * cp - z * sp, z3 = y * sp + z * cp; y = y3; z = z3;
  return [x, y, z];
}

function frame(now) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!dragging) yaw += vel;

  const bg = ctx.createRadialGradient(w * 0.66, h * 0.5, 0, w * 0.66, h * 0.5, Math.max(w, h) * 0.8);
  bg.addColorStop(0, "#071624"); bg.addColorStop(1, "#010205");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

  for (const g of galaxy) {
    ctx.fillStyle = "rgba(150,170,255," + (0.05 * g[2]).toFixed(3) + ")";
    ctx.fillRect(w * 0.3 + g[0] * w * 0.32, h * 0.22 + g[1] * w * 0.32, 2, 2);
  }
  for (const s of stars) {
    const a = 0.35 + 0.45 * Math.abs(Math.sin(now / 1500 + s[3]));
    ctx.fillStyle = "rgba(210,235,255," + (a * s[2] / 1.4).toFixed(3) + ")";
    ctx.fillRect(s[0] * w, s[1] * h, s[2], s[2]);
  }

  const cx = w * 0.66, cy = h * 0.5, R = Math.min(w, h) * 0.34;

  /* atmosphere glow */
  const atm = ctx.createRadialGradient(cx, cy, R * 0.92, cx, cy, R * 1.28);
  atm.addColorStop(0, "rgba(94,242,255,.30)"); atm.addColorStop(0.35, "rgba(60,160,255,.10)"); atm.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = atm; ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, 6.283); ctx.fill();

  /* orbit ring, back half */
  drawRing(cx, cy, R, now, true);

  /* transform, cull, sort, fill */
  const P = V.map(function (v) { return rot(v.p); });
  const vis = [];
  for (let k = 0; k < F.length; k++) {
    const f = F[k], n = rot(f.n);
    if (n[2] <= 0) continue;
    const c = rot(f.c);
    vis.push([k, c[2], n]);
  }
  vis.sort(function (a, b) { return a[1] - b[1]; });
  for (const item of vis) {
    const f = F[item[0]], n = item[2];
    const lit = Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
    const amb = f.land ? 0.16 : 0.22;
    const spec = f.land ? 0 : Math.pow(Math.max(0, lit), 24) * 90;
    const k = amb + lit * 0.95;
    const r = Math.min(255, f.col[0] * k + spec), g = Math.min(255, f.col[1] * k + spec), b = Math.min(255, f.col[2] * k + spec * 1.2);
    const a = P[f.i[0]], bb = P[f.i[1]], c = P[f.i[2]];
    ctx.beginPath();
    ctx.moveTo(cx + a[0] * R, cy - a[1] * R);
    ctx.lineTo(cx + bb[0] * R, cy - bb[1] * R);
    ctx.lineTo(cx + c[0] * R, cy - c[1] * R);
    ctx.closePath();
    const col = "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 0.7;
    ctx.fill(); ctx.stroke();
  }

  /* night-side city lights */
  for (const li of lights) {
    const p = rot(li.p);
    if (p[2] < 0.05) continue;
    const n = norm(p), lit = n[0] * L[0] + n[1] * L[1] + n[2] * L[2];
    if (lit > 0.12) continue;
    const a = Math.min(1, (0.12 - lit) * 4);
    const x = cx + p[0] * R, y = cy - p[1] * R;
    const gl = ctx.createRadialGradient(x, y, 0, x, y, 5 * li.s);
    gl.addColorStop(0, "rgba(255,214,140," + (0.95 * a).toFixed(2) + ")"); gl.addColorStop(1, "rgba(255,180,90,0)");
    ctx.fillStyle = gl; ctx.fillRect(x - 6 * li.s, y - 6 * li.s, 12 * li.s, 12 * li.s);
  }

  /* rim light */
  const rim = ctx.createRadialGradient(cx, cy, R * 0.86, cx, cy, R * 1.04);
  rim.addColorStop(0, "rgba(94,242,255,0)"); rim.addColorStop(1, "rgba(94,242,255,.22)");
  ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(cx, cy, R * 1.04, 0, 6.283); ctx.fill();

  drawRing(cx, cy, R, now, false);
  drawReticle(cx, cy, R, now);

  requestAnimationFrame(frame);
}

function drawRing(cx, cy, R, now, back) {
  const rx = R * 1.55, ry = R * 0.34;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-0.28);
  ctx.strokeStyle = "rgba(94,242,255," + (back ? 0.10 : 0.32) + ")";
  ctx.lineWidth = 1;
  ctx.setLineDash(back ? [2, 6] : [26, 7, 3, 7]);
  ctx.beginPath();
  if (back) ctx.ellipse(0, 0, rx, ry, 0, Math.PI, 2 * Math.PI);
  else ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI);
  ctx.stroke();
  ctx.setLineDash([]);
  for (let k = 0; k < 3; k++) {
    const th = now / (9000 + k * 4000) * 2 * Math.PI + k * 2.1;
    const s = Math.sin(th);
    if ((s < 0) !== back) continue;
    const x = Math.cos(th) * rx, y = s * ry;
    ctx.fillStyle = "#e6fbff";
    ctx.fillRect(x - 2, y - 2, 4, 4);
    ctx.strokeStyle = "rgba(94,242,255,.5)";
    ctx.strokeRect(x - 6, y - 6, 12, 12);
  }
  ctx.restore();
}

function drawReticle(cx, cy, R, now) {
  const p = rot(capital.p);
  if (p[2] < 0.15) return;
  const x = cx + p[0] * R, y = cy - p[1] * R;
  const s = 14 + Math.sin(now / 300) * 2;
  ctx.strokeStyle = "#ffcf6e"; ctx.lineWidth = 1;
  ctx.beginPath();
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(function (d) {
    ctx.moveTo(x + d[0] * s, y + d[1] * (s - 6)); ctx.lineTo(x + d[0] * s, y + d[1] * s); ctx.lineTo(x + d[0] * (s - 6), y + d[1] * s);
  });
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + s, y - s); ctx.lineTo(x + s + 40, y - s - 26); ctx.lineTo(x + s + 150, y - s - 26); ctx.stroke();
  ctx.fillStyle = "#ffcf6e"; ctx.font = "11px Consolas, monospace";
  ctx.fillText(capitalName, x + s + 46, y - s - 32);
  ctx.fillStyle = "rgba(255,207,110,.7)";
  ctx.fillText("PRIMARY SETTLEMENT", x + s + 46, y - s - 14);
}

/* ============================================================== HUD === */
const land = world.regions.filter(function (r) { return !r.barren; });
const ocean = 1 - land.length / world.regions.length;
const avgT = land.reduce(function (s, r) { return s + r.temperature; }, 0) / land.length;
const hab = land.filter(function (r) { return r.habitability > 0.5; }).length / land.length;
function bar(v) { return '<div class="bar"><i style="width:' + Math.round(v * 100) + '%"></i></div>'; }
document.getElementById("panel").innerHTML =
  '<div class="h">// PLANETARY SURVEY</div>' +
  '<div class="row"><span>DESIGNATION</span><b>HD-' + (seed % 90000 + 10000) + '</b></div>' +
  '<div class="row"><span>COLLOQUIAL</span><b>' + capitalName + '</b></div>' +
  '<div class="row"><span>OCEAN COVER</span><b>' + Math.round(ocean * 100) + '%</b></div>' + bar(ocean) +
  '<div class="row"><span>MEAN SURFACE TEMP</span><b>' + Math.round(-30 + avgT * 70) + '°C</b></div>' + bar(avgT) +
  '<div class="row"><span>HABITABLE LAND</span><b>' + Math.round(hab * 100) + '%</b></div>' + bar(hab) +
  '<div class="row"><span>SURVEY SEED</span><b>' + seed + '</b></div>';

const LINES = ["UPLINK NOMINAL // LIGHT-LAG 0.00 S", "NO SIGNALS DETECTED BEYOND HELIOPAUSE",
               "COLONY CHARTER PENDING // AWAITING FIRST INSTANCE", "SURVEY CLOCK: 2200 CE",
               "DRAG TO ROTATE // HOMEWORLD VIEW"];
let li = 0;
const ticker = document.getElementById("ticker");
function tick() { ticker.textContent = "> " + LINES[li++ % LINES.length]; }
tick(); setInterval(tick, 3200);

document.getElementById("go").addEventListener("click", function () {
  location.hash = "seed=" + Math.floor(Math.random() * 1e6);
});

canvas.addEventListener("mousedown", function (e) { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener("mouseup", function () { dragging = false; });
addEventListener("mousemove", function (e) {
  if (!dragging) return;
  yaw += (e.clientX - lastX) * 0.006;
  pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - lastY) * 0.004));
  lastX = e.clientX; lastY = e.clientY;
});

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
